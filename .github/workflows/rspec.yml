name: RSpec Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    #Rubyの厳密なバージョンチェックをスキップする設定
    env:
      BUNDLE_WITH__RUBY_VERSION: "true"

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Install dependencies
      run: |
        gem install bundler
        bundle install

    - name: Run RSpec tests
      run: bundle exec rspec
